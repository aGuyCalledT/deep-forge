spring.application.name=deep-forge
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Database: PostgreSQL in Docker (DB_URL etc. set in docker-compose.yml).
# Without DB_URL the game uses an H2 file database in ./data - handy for a quick local run.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/deepforge;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

# Friends only: when set, new players need this code to register.
deepforge.invite-code=${INVITE_CODE:}
# Comma separated player names that may reset passwords.
deepforge.admins=${ADMINS:}
# Folder with custom sprite PNGs (see docs/SPRITES.md).
deepforge.sprites-dir=${SPRITES_DIR:./sprites}

spring.jackson.default-property-inclusion=non_null
spring.web.resources.cache.cachecontrol.no-cache=true

# Test helpers (resources, dwarves, looks, time skip) for every player. Admins always have them.
deepforge.cheats=${CHEATS:false}
# A test account with a finished hold, made once at startup when both are set (it gets cheats).
deepforge.demo-user=${DEMO_USER:}
deepforge.demo-password=${DEMO_PASSWORD:}
