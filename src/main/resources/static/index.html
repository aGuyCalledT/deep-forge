<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23252d">
  <title>Deep Forge</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- a corner of a forged window: scrolls in the trim metal, a gem where they meet -->
      <symbol id="corner" viewBox="0 0 58 58">
        <path d="M6 52 V18 Q6 6 18 6 H52" fill="none" stroke="var(--t0)" stroke-width="7" stroke-linecap="round"/>
        <path d="M6 52 V18 Q6 6 18 6 H52" fill="none" stroke="var(--t2)" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M6 52 V18 Q6 6 18 6 H52" fill="none" stroke="var(--t4)" stroke-width="1" stroke-linecap="round" opacity=".7" transform="translate(-.6 -.6)"/>
        <path d="M17 44 C17 30 22 22 30 22 C37 22 38 30 32 31 C28 32 27 27 30 26" fill="none" stroke="var(--t3)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M44 17 C30 17 22 22 22 30" fill="none" stroke="var(--t3)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M11 30 l-3 -3 M30 11 l-3 -3" stroke="var(--t1)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="15" cy="15" r="7.5" fill="var(--t1)"/>
        <circle cx="15" cy="15" r="5.6" fill="var(--gem)"/>
        <ellipse cx="13" cy="12.8" rx="2.4" ry="1.6" fill="var(--gem-hi)" opacity=".85"/>
        <path d="M15 20.6 a5.6 5.6 0 0 0 5.4 -4.2" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.4"/>
      </symbol>
      <!-- the crest on top of a window: a trim shield with a bigger gem -->
      <symbol id="crest" viewBox="0 0 92 40">
        <path d="M4 22 C18 22 22 10 34 8 H58 C70 10 74 22 88 22 C74 24 68 34 58 36 H34 C24 34 18 24 4 22 Z" fill="var(--t0)"/>
        <path d="M8 22 C20 21 24 12 35 10.5 H57 C68 12 72 21 84 22 C72 23 66 32 57 33.5 H35 C26 32 20 23 8 22 Z" fill="var(--t2)"/>
        <path d="M35 10.5 H57" stroke="var(--t4)" stroke-width="1.2" opacity=".8"/>
        <path d="M46 11 L56 22 L46 33 L36 22 Z" fill="var(--t1)"/>
        <path d="M46 13.5 L53.5 22 L46 30.5 L38.5 22 Z" fill="var(--gem)"/>
        <path d="M46 13.5 L50 18 L46 20 L42 18 Z" fill="var(--gem-hi)" opacity=".9"/>
        <path d="M38.5 22 L46 30.5 L53.5 22" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="1.2"/>
        <circle cx="22" cy="22" r="2" fill="var(--t4)"/><circle cx="70" cy="22" r="2" fill="var(--t4)"/>
      </symbol>
      <!-- paper: a box drawn by hand, a tick, a wax seal -->
      <symbol id="box" viewBox="0 0 18 18"><path d="M2.5 3 C6 2.4 12 2.6 15.6 2.8 C15.9 7 15.4 12 15.7 15.4 C11 15.8 6 15.3 2.3 15.6 C2.2 11 2.8 6 2.5 3 Z" fill="none" stroke="#3a2614" stroke-width="1.5"/></symbol>
      <symbol id="tick" viewBox="0 0 18 18"><path d="M3.5 9.5 C5 11 6 12.6 7.2 14.4 C9.5 9 12 5.5 16.5 1.8" fill="none" stroke="#8a2a1e" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="seal" viewBox="0 0 62 62">
        <path d="M31 3 C40 4 44 2 50 8 C57 13 58 19 59 27 C61 35 57 41 54 47 C49 55 42 58 33 59 C24 60 17 57 11 51 C5 45 3 38 3 30 C3 21 7 14 13 9 C18 5 24 3 31 3 Z" fill="#8e1f22"/>
        <circle cx="31" cy="31" r="18" fill="none" stroke="#5e1014" stroke-width="2"/>
        <path d="M31 18 L31 44 M22 24 L40 38 M40 24 L22 38" stroke="#5e1014" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M14 18 C18 12 24 9 30 8" fill="none" stroke="#ff9a8e" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>
  <div id="login" class="login" hidden>
    <canvas id="login-art" class="login-art" width="336" height="154"></canvas>
    <h1 class="title">Deep Forge</h1>
    <p class="tagline">Dig deep. Forge well. Trade wisely. Don't lose your dwarves.</p>
    <form id="login-form" class="win neutral login-card" autocomplete="on">
      <svg class="corner tl"><use href="#corner"/></svg><svg class="corner tr"><use href="#corner"/></svg><svg class="corner bl"><use href="#corner"/></svg><svg class="corner br"><use href="#corner"/></svg><svg class="crest"><use href="#crest"/></svg><span class="runes"></span>
      <label>Name <input name="name" autocomplete="username" required minlength="3" maxlength="20"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <label id="invite-row" hidden>Invite code <input name="invite" autocomplete="off"></label>
      <div class="row">
        <button type="submit" class="btn primary" data-mode="login">Enter the hold</button>
        <button type="submit" class="btn" data-mode="register">Found a new hold</button>
      </div>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="hold-name" id="hold-name">Deep Forge</div>
      <div class="res" id="res"></div>
      <button class="audio-btn" id="audio-btn" type="button" aria-label="Music and sound"></button>
    </header>
    <main class="main">
      <section class="scene-wrap" id="scene-wrap" aria-label="Your fortress">
        <canvas id="scene"></canvas>
        <div class="scene-tools" id="scene-tools" hidden></div>
        <div class="alerts" id="alerts" role="status"></div>
      </section>
      <section class="panel win" id="panel" aria-live="polite" hidden></section>
    </main>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-back" data-close></div>
    <div class="sheet-body win" role="dialog" aria-modal="true">
      <svg class="corner tl"><use href="#corner"/></svg><svg class="corner tr"><use href="#corner"/></svg><svg class="corner bl"><use href="#corner"/></svg><svg class="corner br"><use href="#corner"/></svg><svg class="crest"><use href="#crest"/></svg><span class="runes"></span>
      <button class="sheet-x" data-close aria-label="Close" title="Close"></button>
      <div class="sheet-scroll">
        <button class="sheet-grip" aria-label="Fold the window in or out"></button>
        <div id="sheet-content"></div>
      </div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
