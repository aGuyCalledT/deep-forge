<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Forge room editor</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Minecraft"; src: url("../fonts/minecraft.ttf") format("truetype"); }
  :root { --bg: #1b1418; --panel: #261c22; --line: #3d2e36; --text: #eadbc8; --dim: #a8968a; --gold: #f0c060; --bad: #ff7a6a; --good: #7fd07f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.4 "Minecraft", monospace; font-synthesis: none; height: 100vh; display: grid;
         grid-template-rows: auto 1fr; grid-template-columns: 230px 1fr 270px; grid-template-areas: "top top top" "pal stage side"; }
  header { grid-area: top; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .grow { flex: 1; }
  .view { display: contents; }
  .view-toggle { display: none; }
  header label { color: var(--dim); }
  select, input, button { font: inherit; color: var(--text); background: #33262d; border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; }
  input[type=number] { width: 64px; } input[type=checkbox] { padding: 0; }
  button { cursor: pointer; } button:hover { border-color: var(--gold); }
  button.primary { background: #6b4e1e; border-color: var(--gold); } button.danger:hover { border-color: var(--bad); }
  button.on { background: #4a3a20; border-color: var(--gold); }
  .dirty { color: var(--gold); }
  #pal { grid-area: pal; overflow-y: auto; border-right: 1px solid var(--line); padding: 6px; }
  #pal h3 { margin: 10px 2px 4px; font-size: 12px; text-transform: uppercase; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .tool { background: #2e2228; border: 1px solid transparent; border-radius: 4px; padding: 2px; cursor: pointer; text-align: center; font-size: 12px; color: var(--dim); overflow: hidden; }
  .tool canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  .tool:hover { border-color: var(--line); } .tool.on { border-color: var(--gold); color: var(--text); }
  .spots { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .spots .tool { text-align: left; padding: 4px 6px; font-size: 12px; color: var(--text); }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; color: #111; font-weight: 400; font-size: 12px; text-align: center; line-height: 14px; margin-right: 4px; }
  #stage { grid-area: stage; overflow: auto; position: relative; background: #120d10; }
  #stage canvas { display: block; margin: 24px; image-rendering: pixelated; cursor: crosshair; }
  #side { grid-area: side; overflow-y: auto; border-left: 1px solid var(--line); padding: 8px 10px; }
  #side h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; } .row > span:first-child { width: 58px; color: var(--dim); }
  .need { margin: 2px 0; } .need.ok { color: var(--good); } .need.bad { color: var(--bad); }
  .layers div { padding: 2px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; }
  .layers .dwarfline { color: var(--dim); justify-content: center; cursor: default; font-size: 12px; }
  .layers div:hover { background: #33262d; } .layers div.on { background: #4a3a20; }
  .help { color: var(--dim); font-size: 12px; margin-top: 14px; }
  .help kbd { background: #33262d; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; font-size: 12px; }
  .info { width: 16px; height: 16px; padding: 0; border-radius: 50%; font: 12px/14px "Minecraft", monospace; color: var(--dim);
          background: #2e2228; border: 1px solid var(--line); flex: none; vertical-align: middle; margin-left: 4px; }
  .info:hover { color: var(--gold); border-color: var(--gold); }
  header .info { margin-left: -4px; }
  #pop { position: fixed; z-index: 10; display: none; background: #33262d; border: 1px solid var(--gold); border-radius: 5px; padding: 8px 10px;
         font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  #pop.show { display: block; }
  .spots .tool { display: flex; align-items: center; gap: 2px; } .grow { flex: 1; }
  .about { color: var(--dim); font-size: 12px; line-height: 1.35; }
  #side h3 { display: flex; align-items: center; gap: 4px; }
  .row button { padding: 3px 7px; font-size: 12px; }
  #status { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); background: #33262d; border: 1px solid var(--gold); padding: 5px 12px; border-radius: 4px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #status.show { opacity: 1; }
  button:disabled { opacity: .45; cursor: default; } button:disabled:hover { border-color: var(--line); }
  #cv { touch-action: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  ::selection { background: #6b4e1e; color: var(--text); }
  /* phone: the room on top, palette and settings below it, everything big enough for a thumb */
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto;
           grid-template-areas: "top" "stage" "pal" "side"; }
    .view-toggle { display: inline-block; }
    .view { display: none; width: 100%; flex-wrap: wrap; gap: 6px; align-items: center; }
    header.open .view { display: flex; }
    header.open .view-toggle { border-color: var(--gold, #e8b84a); }
    header { position: sticky; top: 0; z-index: 5; gap: 6px; padding: 6px 8px; }
    header label { display: flex; align-items: center; gap: 4px; }
    select, input, button { min-height: 40px; }
    .row button { min-height: 40px; padding: 3px 10px; }
    .info { min-height: 0; width: 24px; height: 24px; }
    #stage { height: 48vh; border-bottom: 1px solid var(--line); }
    #stage canvas { margin: 12px; }
    #pal { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
    #side { border-left: 0; }
    .grid { grid-template-columns: repeat(6, 1fr); }
    .help { display: none; }
  }
</style>
</head>
<body>
<header>
  <button id="close" hidden>Close</button>
  <label>Room <select id="type"></select></label>
  <label>Part <select id="part"><option value="room">room</option><option value="bay">machine bay</option></select></label>
  <label>Template <select id="tpls"></select></label>
  <button id="new">New</button><button id="dup">Duplicate</button><button id="del" class="danger">Delete</button>
  <label>Name <input id="name" size="12" placeholder="e.g. cosy"></label>
  <button id="save" class="primary">Save</button><span id="dirty"></span>
  <span class="grow"></span>
  <button id="tView" class="view-toggle" aria-expanded="false" aria-controls="view">View</button>
  <div id="view" class="view">
  <label>Wall <select id="wall"></select></label>
  <label>Floor <select id="floor"></select></label>
  <label><input type="checkbox" id="vault"> vault</label>
  <button id="tLight" class="on">light</button><button id="tGhost" class="on">dwarves</button><button id="tFront" class="on" title="off: see through the front layer">front</button><button id="tAnim" class="on">animate</button><button id="tGrid" class="on">grid</button>
  <label>Snap <select id="snap"><option value="1">off</option><option value="2">2 px</option><option value="4" selected>4 px</option><option value="6">6 px</option><option value="8">8 px</option><option value="12">12 px</option><option value="24">24 px</option></select></label>
  <label>Zoom <select id="zoom"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
  </div>
</header>
<aside id="pal"></aside>
<main id="stage"><canvas id="cv"></canvas></main>
<aside id="side"></aside>
<div id="status"></div>
<script type="module" src="editor.js"></script>
</body>
</html>
