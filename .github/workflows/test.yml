name: test
on:
  pull_request:
  push:
    branches: [master, development]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          find src/main/resources/static/js src/main/resources/static/editor -name '*.js' -print0 \
            | xargs -0 -n1 node --check
      - name: JSON files
        run: |
          find src/main/resources/static -name '*.json' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
      - name: Tests
        run: mvn -B test
